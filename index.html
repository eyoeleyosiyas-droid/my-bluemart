<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Mart Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b1329;
            --surface-panel: rgba(28, 37, 65, 0.65);
            --border-glow: rgba(91, 192, 190, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #9aa5b1;
            --accent-glow: #5bc0be;
            --accent-hover: #46a19f;
            --danger-glow: #ff5a5f;
            --danger-hover: #e0484c;
            --success-glow: #02c39a;
            --card-radius: 16px;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-stack);
            margin: 0;
            background: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .logo-mark { width: 34px; height: 34px; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 10px; }

        header {
            background: rgba(11, 19, 41, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            color: white;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        header h2 {
            font-weight: 600;
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 35px;
            width: 100%;
        }

        .card {
            background: var(--surface-panel);
            backdrop-filter: blur(16px);
            padding: 28px;
            border-radius: var(--card-radius);
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        h3 {
            margin-top: 0;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.3px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            background: rgba(11, 19, 41, 0.5);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px rgba(91, 192, 190, 0.15);
        }

        button {
            background: var(--accent-glow);
            color: #0b1329;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover { background: var(--accent-hover); }

        .btn-secondary { background: transparent; color: var(--accent-glow); border: 1px solid var(--accent-glow); }
        .btn-secondary:hover { background: rgba(91, 192, 190, 0.1); }

        .btn-danger { background: var(--danger-glow); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; border-collapse: collapse; min-width: 480px; }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-glow);
            font-size: 0.88rem;
            white-space: nowrap;
        }

        th {
            background: rgba(11, 19, 41, 0.4);
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
        }

        td { color: var(--text-primary); }
tr:hover td { background: rgba(255,255,255,0.02); }


.product-cell {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 220px;
}

.product-image,
.no-image {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    border-radius: 10px;
    border: 1px solid var(--border-glow);
}

.product-image {
    display: block;
    object-fit: cover;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.product-image:hover {
    transform: scale(1.08);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
}

.no-image {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(11, 19, 41, 0.6);
    color: var(--text-secondary);
    font-size: 0.65rem;
    text-align: center;
}


.role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .role-seller { background: rgba(91, 192, 190, 0.15); color: var(--accent-glow); }
        .role-you { background: rgba(2, 195, 154, 0.18); color: var(--success-glow); }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-item {
            background: rgba(11, 19, 41, 0.3);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-glow);
        }
        .stat-item h4 { margin: 0; color: var(--accent-glow); font-size: 20px; font-weight: 600; }
        .stat-item p { margin: 6px 0 0 0; color: var(--text-secondary); font-size: 0.78rem; }

        #auth-panel { max-width: 400px; width: 90%; margin: 100px auto; }
        #auth-panel .brand { justify-content: center; margin-bottom: 10px; }
        #main-dashboard { display: none; }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: -4px 0 6px 2px;
        }

        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; padding: 0 20px; }
        }

        @media (max-width: 600px) {
            header { padding: 14px 18px; flex-direction: column; align-items: flex-start; }
            .container { margin: 24px auto; padding: 0 14px; gap: 20px; }
            .card { padding: 18px; }
            #auth-panel { margin: 50px auto; width: 92%; padding: 22px; }
            h3 { font-size: 1rem; }
            th, td { padding: 10px 12px; font-size: 0.8rem; }
            .stat-item h4 { font-size: 17px; }
        }
        .product-cell {
    display: flex;
    align-items: center;
    gap: 12px;
}

.product-image {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border-glow);
    flex-shrink: 0;
}

.no-image {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 10px;
    color: var(--text-secondary);
    background: rgba(11, 19, 41, 0.5);
    border: 1px solid var(--border-glow);
    flex-shrink: 0;
}
.image-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.image-modal.show {
    display: flex;
}

.image-modal-content {
    position: relative;
    max-width: 90vw;
    max-height: 90vh;
}

#modal-image {
    display: block;
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 14px;
    border: 1px solid var(--border-glow);
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
}

.image-modal-close {
    position: absolute;
    top: -45px;
    right: 0;
    width: 38px;
    height: 38px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: var(--danger-glow);
    color: white;
    font-size: 25px;
    line-height: 38px;
    cursor: pointer;
}

.image-modal-close:hover {
    background: var(--danger-hover);
    transform: none;
}        
    </style>
</head>
<body>

    <!-- Authentication Area -->
    <div id="auth-panel" class="card">
        <div class="brand">
            <svg class="logo-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="16" width="40" height="26" rx="4" fill="#1c2541" stroke="#5bc0be" stroke-width="2"/>
                <path d="M14 16 L14 11 A10 10 0 0 1 34 11 L34 16" fill="none" stroke="#5bc0be" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="24" cy="27" r="5" fill="#5bc0be"/>
                <path d="M20.5 27 L23 29.5 L28 24" stroke="#0b1329" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3 id="auth-title" style="border:none; margin:0; padding:0;">Blue Mart</h3>
        </div>
        <input type="text" id="auth-user" placeholder="Username">
        <input type="password" id="auth-pass" placeholder="Password (min 6 chars)">

        <button onclick="handleAuth('login')">Sign In</button>
        <button class="btn-secondary" onclick="handleAuth('register')">Create New Account</button>
    </div>

    <!-- Main Application Interface -->
    <div id="main-dashboard">
        <header>
            <div class="brand">
                <svg class="logo-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="16" width="40" height="26" rx="4" fill="#1c2541" stroke="#5bc0be" stroke-width="2"/>
                    <path d="M14 16 L14 11 A10 10 0 0 1 34 11 L34 16" fill="none" stroke="#5bc0be" stroke-width="2.5" stroke-linecap="round"/>
                    <circle cx="24" cy="27" r="5" fill="#5bc0be"/>
                    <path d="M20.5 27 L23 29.5 L28 24" stroke="#0b1329" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2>Blue Mart</h2>
            </div>
            <div class="user-info">
                <span>Signed in as <strong id="current-user">None</strong></span>
                <a href="#" onclick="handleLogout()" style="color:var(--danger-glow); text-decoration:none; font-weight:600;">Logout</a>
            </div>
        </header>

        <div class="container">

            <!-- Action Forms -->
            <div>
                <div class="card" id="control-card">
                    <h3>Buy or Sell</h3>
                    <p class="hint" style="margin-top:-14px;">
                        Any account can list products and buy from other sellers. You just can't buy your own listing.
                    </p>
                    <select id="action-type" onchange="toggleFormFields()">
                        <option value="sell">Buy an Item</option>
                        <option value="add">List a New Product</option>
                        <option value="restock">Restock My Item</option>
                        <option value="edit">Edit My Item</option>
                        <option value="delete">Remove My Item</option>
                    </select>

                    <input type="text" id="prod-name" placeholder="Product Name">
                    <input type="number" id="prod-price" placeholder="Price ($)" step="0.01">

                    <select id="prod-cat">
                        <option value="">Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Food">Food</option>
                        <option value="Books">Books</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Other">Other</option>
                    </select>

                    <input type="number" id="prod-qty" placeholder="Quantity">
                    <input type="file" id="prod-image" accept="image/*">
                    <button id="action-btn" onclick="executeInventoryAction()">Submit</button>
                </div>

                <div class="card">
                    <h3>Live System Metrics</h3>
                    <div class="stats-grid">
                        <div class="stat-item"><h4 id="stat-count">0</h4><p>Unique Lines</p></div>
                        <div class="stat-item"><h4 id="stat-qty">0</h4><p>Total Units</p></div>
                        <div class="stat-item" style="grid-column: span 2"><h4 id="stat-avg">$0.00</h4><p>Average Value</p></div>
                    </div>
                </div>
            </div>

            <!-- Inventory Display Grid -->
            <div class="card">
                <h3>Current Stock Registers</h3>

                <input type="text" id="search-bar" placeholder="Search products..." onkeyup="filterInventoryTable()">

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Seller</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-body">
                            <!-- rows injected by refreshDashboard() -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUsername = '';

        async function defAPI(url, data) {
            const options = { method: 'POST' };

            if (data instanceof FormData) {
                options.body = data;
            } else {
                options.headers = {'Content-Type': 'application/json'};
                options.body = JSON.stringify(data);
            }

            const res = await fetch(url, options);
            return res.json();
        }

        async function handleAuth(mode) {
            const username = document.getElementById('auth-user').value;
            const password = document.getElementById('auth-pass').value;

            if (!username || !password) return alert('Fill in all fields');

            const res = await defAPI(`/api/${mode}`, { username, password });
            alert(res.message);

            if (res.success) {
                if (mode === 'register') {
                    return;
                }
                enterDashboard(username);
            }
        }

        function enterDashboard(username) {
            currentUsername = username;
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('current-user').innerText = username;
            toggleFormFields();
            refreshDashboard();
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        async function checkExistingSession() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.logged_in) {
                    enterDashboard(data.username);
                }
            } catch (e) {
                console.error('Session check failed:', e);
            }
        }

        function toggleFormFields() {
            const action = document.getElementById('action-type').value;
            const p = document.getElementById('prod-price');
            const c = document.getElementById('prod-cat');
            const q = document.getElementById('prod-qty');
            const img = document.getElementById('prod-image');
            const btn = document.getElementById('action-btn');

            p.style.display = 'block';
            c.style.display = 'block';
            q.style.display = 'block';
            img.style.display = 'none';
            btn.className = '';

            if (action === 'delete') {
                p.style.display = 'none';
                c.style.display = 'none';
                q.style.display = 'none';
                btn.innerText = 'DELETE MY LISTING';
                btn.className = 'btn-danger';
            } else if (action === 'sell') {
                p.style.display = 'none';
                c.style.display = 'none';
                btn.innerText = 'BUY THIS ITEM';
            } else if (action === 'restock') {
                p.style.display = 'none';
                c.style.display = 'none';
                btn.innerText = 'ADD MORE STOCK';
            } else if (action === 'edit') {
                btn.innerText = 'SAVE CHANGES (leave a field blank to keep it unchanged)';
            } else {
                img.style.display = 'block';
                btn.innerText = 'LIST PRODUCT';
            }
        }

        // Each backend schema only accepts specific fields - sending extras
        // (like price/category on a delete request) gets rejected as an
        // "unknown field" validation error. Build the payload per-action,
        // and route each action to its own endpoint.
        async function executeInventoryAction() {
            const action = document.getElementById('action-type').value;
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-cat').value;
            const quantity = document.getElementById('prod-qty').value;

            if (!name) return alert('Product Name is required');

            // NEW PRODUCT — uses multipart/form-data so an image can be attached.
            // Everything for this action lives inside this block and ends in
            // `return`, so it never falls through into the other actions below.
            if (action === 'add') {
                if (!price || !category || !quantity) {
                    return alert('Price, category, and quantity are all required to list a product');
                }

                const imageInput = document.getElementById('prod-image');
                const formData = new FormData();
                formData.append('name', name);
                formData.append('price', price);
                formData.append('category', category);
                formData.append('quantity', quantity);

                if (imageInput.files.length > 0) {
                    formData.append('image', imageInput.files[0]);
                }

                try {
                    const res = await fetch('/api/products/add', {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    alert(data.message);
                    if (data.success) {
                        refreshDashboard();
                    }
                } catch (e) {
                    console.error('Product upload failed:', e);
                    alert('Failed to add product.');
                }

                return;
            }

            // OTHER ACTIONS — plain JSON, only the fields each endpoint expects.
            let payload;

            if (action === 'edit') {
                payload = { name };
                if (price !== '') payload.price = parseFloat(price);
                if (category !== '') payload.category = category;
                if (quantity !== '') payload.quantity = parseInt(quantity, 10);

            } else if (action === 'sell' || action === 'restock') {
                if (!quantity) return alert('Quantity is required');
                payload = { name, quantity: parseInt(quantity, 10) };

            } else if (action === 'delete') {
                payload = { name };
            }

            const res = await defAPI(`/api/products/${action}`, payload);
            alert(res.message);
            refreshDashboard();
        }

        async function refreshDashboard() {
            const res = await fetch('/api/products');
            const products = await res.json();

            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                const isOwn = p['Seller'] === currentUsername;
                const tr = document.createElement('tr');
                tr.innerHTML = `
    <td>
        <div class="product-cell">
            ${
                p['image_url']
                    ? `<img src="${p['image_url']}" 
                        alt="${p['Product Name']}" 
                        class="product-image"
                        onclick="window.open('${p['image_url']}', '_blank')">`
                    : `<div class="no-image">No Image</div>`
            }
            <strong>${p['Product Name']}</strong>
        </div>
    </td>
    <td>${p['Category'] || 'General'}</td>
    <td>$${parseFloat(p['Price']).toFixed(2)}</td>
    <td>${p['Quantity']} units</td>
    <td>
        <span class="role-badge ${isOwn ? 'role-you' : 'role-seller'}">
            ${p['Seller'] || 'System Drop'}${isOwn ? ' (You)' : ''}
        </span>
    </td>
`;
                tbody.appendChild(tr);
            });

            const statsRes = await fetch('/api/statistics');
            const stats = await statsRes.json();
            document.getElementById('stat-count').innerText = stats.total_products;
            document.getElementById('stat-qty').innerText = stats.total_quantity;
            document.getElementById('stat-avg').innerText = stats.avg_price;
        }

        function filterInventoryTable() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const rows = document.querySelectorAll('#inventory-body tr');
            rows.forEach(row => {
                const text = row.querySelector('td').innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        checkExistingSession();
    </script>
</body>
</html>
