<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Mart Marketplace</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b1329;
            --surface-panel: rgba(28, 37, 65, 0.65);
            --border-glow: rgba(91, 192, 190, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #9aa5b1;
            --accent-glow: #5bc0be;
            --accent-hover: #46a19f;
            --danger-glow: #ff5a5f;
            --danger-hover: #e0484c;
            --success-glow: #02c39a;
            --card-radius: 16px;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            background: var(--bg-canvas);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(11, 19, 41, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h2 {
            font-weight: 600;
            font-size: 1.4rem;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 35px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--surface-panel);
            backdrop-filter: blur(16px);
            padding: 28px;
            border-radius: var(--card-radius);
            border: 1px solid var(--border-glow);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 8px 32px 0 rgba(91, 192, 190, 0.05);
        }

        h3 {
            margin-top: 0;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glow);
            margin-bottom: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            box-sizing: border-box;
            background: rgba(11, 19, 41, 0.5);
            color: var(--text-primary);
            font-family: var(--font-stack);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px rgba(91, 192, 190, 0.15);
        }

        select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button {
            background: var(--accent-glow);
            color: #0b1329;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            letter-spacing: -0.1px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-glow);
            border: 1px solid var(--accent-glow);
        }

        .btn-secondary:hover {
            background: rgba(91, 192, 190, 0.1);
        }

        .btn-danger { background: var(--danger-glow); color: white; }
        .btn-danger:hover { background: var(--danger-hover); }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-glow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-glow);
            font-size: 0.9rem;
        }

        th {
            background: rgba(11, 19, 41, 0.4);
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        td { color: var(--text-primary); }
        tr:hover td { background: rgba(255,255,255,0.02); }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .role-seller { background: rgba(2, 195, 154, 0.15); color: var(--success-glow); }
        .role-buyer { background: rgba(91, 192, 190, 0.15); color: var(--accent-glow); }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .stat-item {
            background: rgba(11, 19, 41, 0.3);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-glow);
        }
        .stat-item h4 { margin: 0; color: var(--accent-glow); font-size: 22px; font-weight: 600; }
        .stat-item p { margin: 6px 0 0 0; color: var(--text-secondary); font-size: 0.8rem; font-weight: 400; }

        #auth-panel {
            max-width: 420px;
            margin: 120px auto;
            box-sizing: border-box;
        }
        #main-dashboard { display: none; }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin: -4px 0 6px 2px;
        }

        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; padding: 0 20px; }
            header { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Authentication Area -->
    <div id="auth-panel" class="card">
        <h3 id="auth-title">Blue Mart Security Portal</h3>
        <input type="text" id="auth-user" placeholder="Username">
        <input type="password" id="auth-pass" placeholder="Password (min 6 chars)">

        <!-- Role only matters when creating a new account -->
        <select id="auth-role" onchange="toggleSellerCodeField()">
            <option value="buyer">Sign Up as Buyer (View & Purchase)</option>
            <option value="seller">Sign Up as Seller (Manage Inventory)</option>
        </select>

        <input type="password" id="auth-seller-code" placeholder="Seller Access Code" style="display:none;">
        <div class="hint" id="seller-code-hint" style="display:none;">Only used when signing up as a seller.</div>

        <button onclick="handleAuth('login')">Sign In</button>
        <button class="btn-secondary" onclick="handleAuth('register')">Create New Account</button>
    </div>

    <!-- Main Application Interface -->
    <div id="main-dashboard">
        <header>
            <h2>Blue Mart Management Studio</h2>
            <div>
                Logged in as: <strong id="current-user">None</strong>
                <span id="user-role-badge" class="role-badge"></span> |
                <a href="#" onclick="handleLogout()" style="color:var(--danger-glow); text-decoration:none; font-weight:600; margin-left:10px;">Logout</a>
            </div>
        </header>

        <div class="container">

            <!-- Action Forms -->
            <div>
                <div class="card" id="control-card">
                    <h3 id="control-title">Inventory Controls</h3>
                    <select id="action-type" onchange="toggleFormFields()">
                        <option value="sell">Purchase Stock (Buyer view)</option>
                        <option value="add" id="opt-add" style="display:none;">Add / Match Product</option>
                        <option value="restock" id="opt-restock" style="display:none;">Restock Item</option>
                        <option value="edit" id="opt-edit" style="display:none;">Modify Fields</option>
                        <option value="delete" id="opt-delete" style="display:none;">Remove Product</option>
                    </select>

                    <input type="text" id="prod-name" placeholder="Product Name">
                    <input type="number" id="prod-price" placeholder="Price ($)" step="0.01">
                    <input type="text" id="prod-cat" placeholder="Category">
                    <input type="number" id="prod-qty" placeholder="Quantity">

                    <button id="action-btn" onclick="executeInventoryAction()">Submit Action</button>
                </div>

                <div class="card">
                    <h3>Live System Metrics</h3>
                    <div class="stats-grid">
                        <div class="stat-item"><h4 id="stat-count">0</h4><p>Unique Lines</p></div>
                        <div class="stat-item"><h4 id="stat-qty">0</h4><p>Total Units</p></div>
                        <div class="stat-item" style="grid-column: span 2"><h4 id="stat-avg">$0.00</h4><p>Average Value</p></div>
                    </div>
                </div>
            </div>

            <!-- Inventory Display Grid -->
            <div class="card">
                <h3>Current Stock Registers</h3>

                <input type="text" id="search-bar" placeholder="Search products..." onkeyup="filterInventoryTable()">

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Seller</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-body">
                            <!-- rows injected by refreshDashboard() -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentUserRole = 'buyer';

        async function defAPI(url, data) {
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            return res.json();
        }

        function toggleSellerCodeField() {
            const isSellerChoice = document.getElementById('auth-role').value === 'seller';
            document.getElementById('auth-seller-code').style.display = isSellerChoice ? 'block' : 'none';
            document.getElementById('seller-code-hint').style.display = isSellerChoice ? 'block' : 'none';
        }

        async function handleAuth(mode) {
            const username = document.getElementById('auth-user').value;
            const password = document.getElementById('auth-pass').value;
            const role = document.getElementById('auth-role').value;
            const sellerCode = document.getElementById('auth-seller-code').value;

            if (!username || !password) return alert('Fill in all fields');

            // Role/seller code only matter for registration; login ignores them.
            const payload = mode === 'register'
                ? {username, password, role, seller_code: sellerCode}
                : {username, password};

            const res = await defAPI(`/api/${mode}`, payload);
            alert(res.message);

            if (res.success) {
                if (mode === 'register') {
                    // Don't auto-login on register; let them sign in explicitly.
                    return;
                }
                currentUserRole = res.role || 'buyer';
                enterDashboard(username);
            }
        }

        function enterDashboard(username) {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            document.getElementById('current-user').innerText = username;

            const badge = document.getElementById('user-role-badge');
            badge.innerText = currentUserRole;
            badge.className = `role-badge role-${currentUserRole}`;

            setupInterfacePermissions();
            refreshDashboard();
        }

        async function handleLogout() {
            await fetch('/api/logout', { method: 'POST' });
            location.reload();
        }

        // Re-enter the dashboard automatically if the session cookie is still valid
        // (e.g. after a page refresh), instead of always showing the login screen.
        async function checkExistingSession() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (data.logged_in) {
                    currentUserRole = data.role;
                    enterDashboard(data.username);
                }
            } catch (e) {
                console.error('Session check failed:', e);
            }
        }

        function setupInterfacePermissions() {
            const isSeller = (currentUserRole === 'seller');

            document.getElementById('opt-add').style.display = isSeller ? 'block' : 'none';
            document.getElementById('opt-restock').style.display = isSeller ? 'block' : 'none';
            document.getElementById('opt-edit').style.display = isSeller ? 'block' : 'none';
            document.getElementById('opt-delete').style.display = isSeller ? 'block' : 'none';

            document.getElementById('action-type').value = isSeller ? 'add' : 'sell';
            toggleFormFields();
        }

        function toggleFormFields() {
            const action = document.getElementById('action-type').value;
            const p = document.getElementById('prod-price');
            const c = document.getElementById('prod-cat');
            const q = document.getElementById('prod-qty');
            const btn = document.getElementById('action-btn');

            p.style.display = 'block';
            c.style.display = 'block';
            q.style.display = 'block';
            btn.className = '';

            if (action === 'delete') {
                p.style.display = 'none';
                c.style.display = 'none';
                q.style.display = 'none';
                btn.innerText = 'DELETE PRODUCT FROM REGISTRY';
                btn.className = 'btn-danger';
            } else if (action === 'sell') {
                p.style.display = 'none';
                c.style.display = 'none';
                btn.innerText = 'PURCHASE UNITS FROM VENDOR';
            } else if (action === 'restock') {
                p.style.display = 'none';
                c.style.display = 'none';
                btn.innerText = 'ADD ADDITIONAL BATCH STOCK';
            } else if (action === 'edit') {
                btn.innerText = 'UPDATE PRODUCT SPECIFICATIONS';
            } else {
                btn.innerText = 'REGISTER PRODUCT TO MARKETPLACE';
            }
        }

        async function executeInventoryAction() {
            const action = document.getElementById('action-type').value;
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-cat').value;
            const quantity = document.getElementById('prod-qty').value;

            if (!name) return alert('Product Name is required');

            let endpoint = `/api/products/${action}`;
            let payload = { name, price, category, quantity };

            const res = await defAPI(endpoint, payload);
            alert(res.message);
            refreshDashboard();
        }

        async function refreshDashboard() {
            const res = await fetch('/api/products');
            const products = await res.json();

            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p['Product Name']}</strong></td>
                    <td>${p['Category'] || 'General'}</td>
                    <td>$${parseFloat(p['Price']).toFixed(2)}</td>
                    <td>${p['Quantity']} units</td>
                    <td><span class="role-badge role-seller">${p['Seller'] || 'System Drop'}</span></td>
                `;
                tbody.appendChild(tr);
            });

            const statsRes = await fetch('/api/statistics');
            const stats = await statsRes.json();
            document.getElementById('stat-count').innerText = stats.total_products;
            document.getElementById('stat-qty').innerText = stats.total_quantity;
            document.getElementById('stat-avg').innerText = stats.avg_price;
        }

        function filterInventoryTable() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            const rows = document.querySelectorAll('#inventory-body tr');
            rows.forEach(row => {
                const text = row.querySelector('td').innerText.toLowerCase();
                row.style.display = text.includes(query) ? '' : 'none';
            });
        }

        // Run on page load
        checkExistingSession();
    </script>
</body>
</html>
